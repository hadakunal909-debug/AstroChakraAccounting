spring.application.name=accounting-backend
server.port=8080

# Don't keep DB sessions open during view rendering (REST API)
spring.jpa.open-in-view=false

# JSON uses snake_case so the React client (which expects DB column names
# like liquid_reserve, project_code) stays a drop-in replacement.
spring.jackson.property-naming-strategy=SNAKE_CASE

# ===== Datasource: the real Supabase Postgres (provide via environment) =====
# SUPABASE_DB_URL example:
#   jdbc:postgresql://db.<project>.supabase.co:5432/postgres?sslmode=require
spring.datasource.url=${SUPABASE_DB_URL:}
spring.datasource.username=${SUPABASE_DB_USER:postgres}
spring.datasource.password=${SUPABASE_DB_PASSWORD:}

# NEVER let Hibernate alter the existing schema. validate = fail fast on mismatch.
spring.jpa.hibernate.ddl-auto=validate

# ===== Auth / CORS =====
app.jwt.secret=${JWT_SECRET:dev-only-insecure-secret-please-override-with-32+-bytes}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173}
