# Profile that points the backend at the real Supabase Postgres (Session pooler).
# Activate with: -Dspring.profiles.active=supabase  (env vars provide the credentials)
# ddl-auto=validate => Hibernate checks the entities against the REAL tables and never alters them.
spring.datasource.url=${SUPABASE_DB_URL}
spring.datasource.username=${SUPABASE_DB_USER}
spring.datasource.password=${SUPABASE_DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
