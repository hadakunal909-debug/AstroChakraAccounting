# Local smoke-test profile: in-memory H2, schema generated from the entities.
# Run with:  mvn spring-boot:run -Dspring-boot.run.profiles=dev
# Lets the full web/security/JPA stack start with no external database.
spring.datasource.url=jdbc:h2:mem:accounting;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
